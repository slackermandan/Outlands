<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aspect Mastery — Level Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f3f4f6;
    padding: 32px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px 0; }
  p.subtitle { color: #9ca3af; font-size: 14px; margin: 0 0 24px 0; }

  .panel {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 20px;
  }
  .panel + .panel { margin-top: 16px; }
  .panel h2 {
    font-size: 14px;
    font-weight: 600;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 16px 0;
  }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    background: #111827;
    border: 1px solid #374151;
    border-radius: 6px;
    color: #f3f4f6;
  }
  .field input:focus { outline: none; border-color: #38bdf8; }
  .field .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }

  .error {
    color: #f87171;
    font-size: 13px;
    margin-top: 4px;
  }

  .results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat {
    background: #111827;
    border: 1px solid #374151;
    border-radius: 8px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat .value {
    font-size: 20px;
    font-weight: 700;
    color: #38bdf8;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .stat .label {
    font-size: 12px;
    color: #9ca3af;
  }

  @media (max-width: 420px) {
    .results { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Aspect Mastery</h1>
  <p class="subtitle">Figure out what it takes to reach a target aspect level from where you're at.</p>

  <div class="panel">
    <h2>Your Aspect</h2>
    <div class="field">
      <label for="current-level">Current level (0–14)</label>
      <input id="current-level" type="number" inputmode="numeric" min="0" max="14" value="0" />
    </div>
    <div class="field">
      <label for="current-xp">Current XP toward next level</label>
      <input id="current-xp" type="number" inputmode="numeric" min="0" value="0" />
      <div class="hint" id="current-xp-hint"></div>
    </div>
    <div class="field">
      <label for="target-level">Target level (1–15)</label>
      <input id="target-level" type="number" inputmode="numeric" min="1" max="15" value="1" />
    </div>
    <div class="error" id="error-msg" style="display:none;"></div>
  </div>

  <div class="panel">
    <h2>Needed to Reach Target</h2>
    <div class="results">
      <div class="stat">
        <div class="value" id="xp-needed">—</div>
        <div class="label">XP</div>
      </div>
      <div class="stat">
        <div class="value" id="cores-needed">—</div>
        <div class="label">Cores</div>
      </div>
      <div class="stat">
        <div class="value" id="distills-needed">—</div>
        <div class="label">Distillations</div>
      </div>
    </div>
  </div>
</div>

<script>
const levels = [
  { level: 0,  xp: 0,      distillations: 2,  cores: 4,  cumulDistils: 2,  cumulCores: 4 },
  { level: 1,  xp: 500,    distillations: 1,  cores: 2,  cumulDistils: 3,  cumulCores: 6 },
  { level: 2,  xp: 1000,   distillations: 1,  cores: 2,  cumulDistils: 4,  cumulCores: 8 },
  { level: 3,  xp: 1500,   distillations: 1,  cores: 2,  cumulDistils: 5,  cumulCores: 10 },
  { level: 4,  xp: 2000,   distillations: 1,  cores: 2,  cumulDistils: 6,  cumulCores: 12 },
  { level: 5,  xp: 2500,   distillations: 1,  cores: 2,  cumulDistils: 7,  cumulCores: 14 },
  { level: 6,  xp: 3000,   distillations: 2,  cores: 3,  cumulDistils: 9,  cumulCores: 17 },
  { level: 7,  xp: 3500,   distillations: 2,  cores: 4,  cumulDistils: 11, cumulCores: 21 },
  { level: 8,  xp: 4000,   distillations: 2,  cores: 5,  cumulDistils: 13, cumulCores: 26 },
  { level: 9,  xp: 4500,   distillations: 3,  cores: 7,  cumulDistils: 16, cumulCores: 33 },
  { level: 10, xp: 5000,   distillations: 4,  cores: 10, cumulDistils: 20, cumulCores: 43 },
  { level: 11, xp: 15000,  distillations: 5,  cores: 15, cumulDistils: 25, cumulCores: 58 },
  { level: 12, xp: 25000,  distillations: 6,  cores: 20, cumulDistils: 31, cumulCores: 78 },
  { level: 13, xp: 40000,  distillations: 8,  cores: 30, cumulDistils: 39, cumulCores: 108 },
  { level: 14, xp: 120000, distillations: 12, cores: 40, cumulDistils: 51, cumulCores: 148 },
  { level: 15, xp: 250000, distillations: 16, cores: 50, cumulDistils: 67, cumulCores: 198 },
];

let cumulXp = 0;
levels.forEach(l => { cumulXp += l.xp; l.cumulXp = cumulXp; });

const MAX_LEVEL = 15;

const currentLevelInput = document.getElementById("current-level");
const currentXpInput = document.getElementById("current-xp");
const targetLevelInput = document.getElementById("target-level");
const currentXpHint = document.getElementById("current-xp-hint");
const errorMsg = document.getElementById("error-msg");

const xpNeededEl = document.getElementById("xp-needed");
const coresNeededEl = document.getElementById("cores-needed");
const distillsNeededEl = document.getElementById("distills-needed");

function sanitizeInt(input, min, max) {
  let n = parseInt(input.value, 10);
  if (isNaN(n)) n = min;
  if (n < min) n = min;
  if (n > max) n = max;
  input.value = String(n);
  return n;
}

function recalc() {
  const currentLevel = sanitizeInt(currentLevelInput, 0, MAX_LEVEL - 1);

  const nextLevelXp = levels[currentLevel + 1].xp;
  const maxCurrentXp = nextLevelXp - 1;
  currentXpInput.max = String(maxCurrentXp);
  currentXpHint.textContent = `Max ${maxCurrentXp.toLocaleString()} (XP needed for level ${currentLevel + 1} is ${nextLevelXp.toLocaleString()})`;
  const currentXp = sanitizeInt(currentXpInput, 0, maxCurrentXp);

  const targetLevel = sanitizeInt(targetLevelInput, 1, MAX_LEVEL);

  if (targetLevel <= currentLevel) {
    errorMsg.textContent = "Target level must be greater than your current level.";
    errorMsg.style.display = "block";
    xpNeededEl.textContent = "—";
    coresNeededEl.textContent = "—";
    distillsNeededEl.textContent = "—";
    return;
  }
  errorMsg.style.display = "none";

  const xpNeeded = levels[targetLevel].cumulXp - levels[currentLevel].cumulXp - currentXp;
  const coresNeeded = levels[targetLevel].cumulCores - levels[currentLevel].cumulCores;
  const distillsNeeded = levels[targetLevel].cumulDistils - levels[currentLevel].cumulDistils;

  xpNeededEl.textContent = xpNeeded.toLocaleString();
  coresNeededEl.textContent = coresNeeded.toLocaleString();
  distillsNeededEl.textContent = distillsNeeded.toLocaleString();
}

[currentLevelInput, currentXpInput, targetLevelInput].forEach(input => {
  input.addEventListener("input", recalc);
});

recalc();
</script>
</body>
</html>
