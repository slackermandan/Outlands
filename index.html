<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outlands</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #f3f4f6;
    padding: 48px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 8px 0; }
  p.subtitle { color: #9ca3af; font-size: 15px; margin: 0 0 32px 0; }
  .card {
    display: block;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 20px;
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover {
    border-color: #38bdf8;
    transform: translateY(-2px);
  }
  .card-title {
    color: #38bdf8;
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .card-desc {
    color: #9ca3af;
    font-size: 14px;
    margin: 0;
  }
  .card + .card {
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Outlands</h1>
    <p class="subtitle">Content, info, and tools for the Outlands Ultima server</p>
    <a class="card" href="mastery-chain/">
      <p class="card-title">Mastery Chain — XP Tracker</p>
      <p class="card-desc">Cumulative XP by link across all 30 links, with a lookup tool.</p>
    </a>
    <a class="card" href="aspect-mastery/">
      <p class="card-title">Aspect Mastery</p>
      <p class="card-desc">Calculate the XP, cores, and distillations needed to reach a target aspect level.</p>
    </a>
  </div>
</body>
</html>
